<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ค้นหาแพทย์ - MedPoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #fff;
        }
    </style>
</head>

<body class="text-slate-800 min-h-screen">
    <!-- ใช้ navbar ส่วนกลางของเพื่อน ไม่สร้างระบบ Login/Navbar ซ้ำ -->
    <header id="navbar" class="bg-white border-b border-slate-200/80 sticky top-0 z-40"></header>

    <main class="max-w-[1250px] mx-auto px-4 sm:px-6 py-10 sm:py-12">
        <h1 class="font-bold text-[#022F56] text-3xl sm:text-4xl lg:text-[44px] mb-7">ค้นหาแพทย์</h1>

        <form id="doctor-search-form"
            class="bg-[#F5F9FC] rounded-[13px] px-4 py-4 mb-7 grid grid-cols-1 md:grid-cols-12 gap-3" novalidate>
            <label class="md:col-span-5 relative block">
                <span class="sr-only">ค้นหาชื่อแพทย์หรือความเชี่ยวชาญ</span>
                <i data-lucide="search"
                    class="absolute top-3.5 left-3.5 w-5 h-5 text-[#718497] pointer-events-none"></i>
                <input id="search-name" type="search" placeholder="ค้นหาชื่อแพทย์หรือความเชี่ยวชาญ"
                    class="w-full h-[49px] bg-white border border-[#E4EDF4] rounded-[9px] pl-11 pr-3 outline-none focus:ring-2 focus:ring-[#488DB4] text-sm text-[#022F56]" />
            </label>
            <label class="md:col-span-3 block">
                <span class="sr-only">เลือกสาขาการรักษา</span>
                <select id="search-department"
                    class="w-full h-[49px] bg-white border border-[#E4EDF4] rounded-[9px] px-3 outline-none focus:ring-2 focus:ring-[#488DB4] text-sm text-[#022F56]">
                    <option value="">ทุกสาขาการรักษา</option>
                </select>
            </label>
            <label class="md:col-span-3 block">
                <span class="sr-only">วันที่ออกตรวจ</span>
                <input id="search-date" type="date" title="วันที่ออกตรวจ"
                    class="w-full h-[49px] bg-white border border-[#E4EDF4] rounded-[9px] px-3 outline-none focus:ring-2 focus:ring-[#488DB4] text-sm text-[#022F56]" />
            </label>
            <button type="submit"
                class="md:col-span-1 h-[49px] px-4 bg-[#165B7B] hover:bg-[#0E4564] text-white font-medium text-sm rounded-[9px] transition">ค้นหา</button>
        </form>

        <div class="flex items-center justify-between gap-3 mb-5">
            <h2 class="text-[#022F56] font-semibold text-xl sm:text-[22px]">แพทย์ทั้งหมด</h2>
            <p id="doctor-count" class="text-[#718497] text-sm" aria-live="polite">กำลังโหลดข้อมูล...</p>
        </div>

        <div id="doctor-error" role="alert"
            class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-5 mb-5 text-sm"></div>
        <div id="doctor-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5 lg:gap-6" aria-live="polite">
            <div class="col-span-full py-14 text-center text-[#718497]">กำลังโหลดรายชื่อแพทย์...</div>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script>
        renderNavbar('doctors');

        const form = document.getElementById('doctor-search-form');
        const nameInput = document.getElementById('search-name');
        const departmentInput = document.getElementById('search-department');
        const dateInput = document.getElementById('search-date');
        const countElement = document.getElementById('doctor-count');
        const listElement = document.getElementById('doctor-list');
        const errorElement = document.getElementById('doctor-error');
        let doctors = [];
        let requestSerial = 0;

        // ให้วันที่เลือกเป็นปฏิทินไทย (ไม่เลือกย้อนหลัง)
        const todayThailand = new Date(Date.now() + 7 * 60 * 60 * 1000)
            .toISOString().slice(0, 10);
        dateInput.min = todayThailand;

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function thaiDate(isoDate) {
            return new Date(isoDate).toLocaleDateString('th-TH', {
                timeZone: 'Asia/Bangkok', day: 'numeric', month: 'short', year: 'numeric'
            });
        }

        function doctorStatus(doctor) {
            if (String(doctor.status).toLowerCase() !== 'active') {
                return { text: 'งดรับนัด', badge: 'bg-[#FCE9EB] text-[#B94B53]', bookable: false };
            }
            const slots = doctor.schedules || [];
            if (slots.length === 0) {
                return { text: 'ไม่เข้าเวร', badge: 'bg-[#EDF2F6] text-[#718497]', bookable: false };
            }
            if (slots.every(slot => slot.isBooked)) {
                return { text: 'คิวเต็ม', badge: 'bg-[#FFF3D8] text-[#996300]', bookable: false };
            }
            return { text: 'พร้อมรับนัด', badge: 'bg-[#E8F6EE] text-[#237749]', bookable: true };
        }

        function scheduleSummary(doctor) {
            const schedules = doctor.schedules || [];
            if (schedules.length === 0) {
                return { date: 'ยังไม่มีตารางออกตรวจ', time: 'กรุณาตรวจสอบอีกครั้งภายหลัง' };
            }
            const first = schedules.find(s => !s.isBooked) || schedules[0];
            return {
                date: thaiDate(first.availableDate),
                time: `${first.startTime} - ${first.endTime} น.`
            };
        }

        function renderDepartments() {
            const previous = departmentInput.value;
            const values = [...new Set(doctors.map(d => d.department).filter(Boolean))]
                .sort((a, b) => a.localeCompare(b, 'th'));
            departmentInput.replaceChildren(new Option('ทุกสาขาการรักษา', ''));
            values.forEach(value => departmentInput.add(new Option(value, value)));
            if (values.includes(previous)) departmentInput.value = previous;
        }

        function showError(message) {
            errorElement.textContent = message;
            errorElement.classList.remove('hidden');
        }

        function renderDoctors() {
            const keyword = nameInput.value.trim().toLocaleLowerCase('th');
            const department = departmentInput.value;
            const selectedDate = dateInput.value;
            const matching = doctors.filter(doctor => {
                const text = `${doctor.docName} ${doctor.specialization} ${doctor.department}`
                    .toLocaleLowerCase('th');
                return (!keyword || text.includes(keyword)) &&
                    (!department || doctor.department === department) &&
                    (!selectedDate || (doctor.schedules || []).length > 0);
            });

            countElement.textContent = `พบแพทย์ ${matching.length} ท่าน`;
            if (matching.length === 0) {
                listElement.innerHTML = '<div class="col-span-full text-center py-16 rounded-2xl border border-[#E4EDF4] bg-[#F5F9FC] text-[#718497]">ไม่พบแพทย์ตามเงื่อนไขที่เลือก</div>';
                return;
            }

            listElement.innerHTML = matching.map(doctor => {
                const status = doctorStatus(doctor);
                const schedule = scheduleSummary(doctor);
                const doctorId = escapeHtml(doctor.id);
                return `
          <article class="min-h-[244px] bg-white border border-[#E4EDF4] rounded-[15px] p-5 flex flex-col">
            <div class="flex gap-4 items-start mb-3">
              <div class="shrink-0 w-[78px] h-[78px] rounded-full bg-[#EAF6FC] flex items-center justify-center text-[#488DB4]">
                <i data-lucide="user-round" class="w-11 h-11 stroke-[1.6]"></i>
              </div>
              <div class="min-w-0">
                <h3 class="text-[#022F56] text-[17px] font-semibold leading-snug mb-1">${escapeHtml(doctor.docName)}</h3>
                <p class="text-[#488DB4] text-sm mb-2">${escapeHtml(doctor.specialization)}</p>
                <span class="inline-flex px-3 py-1 rounded-full text-[11px] font-semibold ${status.badge}">${status.text}</span>
              </div>
            </div>
            <p class="text-[#718497] text-[13px] mb-3 line-clamp-2">${escapeHtml(doctor.department)}</p>
            <div class="border-t border-[#E4EDF4] pt-3 mt-auto flex items-end justify-between gap-2">
              <div class="min-w-0">
                <p class="text-[#022F56] text-[13px] flex gap-1.5 items-center mb-1"><i data-lucide="clock-3" class="w-4 h-4 shrink-0"></i>${escapeHtml(schedule.date)}</p>
                <p class="text-[#718497] text-[13px]">${escapeHtml(schedule.time)}</p>
              </div>
              <button type="button" data-doctor-id="${doctorId}" ${status.bookable ? '' : 'disabled'}
                class="shrink-0 min-w-[120px] px-3 h-11 rounded-[9px] text-sm font-semibold transition ${status.bookable ? 'text-white bg-[#165B7B] hover:bg-[#0E4564]' : 'bg-[#F0F4F7] text-[#718497] cursor-not-allowed'}">
                ${status.bookable ? 'จองคิว →' : 'จองไม่ได้'}
              </button>
            </div>
          </article>`;
            }).join('');
            if (window.lucide) window.lucide.createIcons();
        }

        async function loadDoctors() {
            const serial = ++requestSerial;
            errorElement.classList.add('hidden');
            countElement.textContent = 'กำลังโหลดข้อมูล...';
            const dateParam = dateInput.value ? `?date=${encodeURIComponent(dateInput.value)}` : '';
            try {
                const response = await fetch(`${API_URL}/doctors${dateParam}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('รูปแบบข้อมูลแพทย์ไม่ถูกต้อง');
                if (serial !== requestSerial) return;
                doctors = data;
                renderDepartments();
                renderDoctors();
            } catch (error) {
                if (serial !== requestSerial) return;
                doctors = [];
                countElement.textContent = 'โหลดข้อมูลไม่สำเร็จ';
                listElement.innerHTML = '';
                showError('ดึงรายชื่อแพทย์ไม่สำเร็จ กรุณาตรวจสอบว่า Server รันอยู่และมี API /api/v1/doctors แล้ว');
                console.error('Load doctors error:', error);
            }
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            renderDoctors();
        });
        dateInput.addEventListener('change', loadDoctors);
        departmentInput.addEventListener('change', renderDoctors);
        nameInput.addEventListener('input', renderDoctors);

        // ปุ่มนี้ยังไม่บันทึกนัดหมาย จนกว่าเราจะสร้างหน้าจองคิวขั้นถัดไป
        listElement.addEventListener('click', (event) => {
            const button = event.target.closest('button[data-doctor-id]');
            if (!button || button.disabled) return;
            const selectedDoctor = doctors.find(d => d.id === button.dataset.doctorId);

            if (selectedDoctor) {
                const params = new URLSearchParams({
                    doctorId: selectedDoctor.id
                });

                if (dateInput.value) {
                    params.set('date', dateInput.value);
                }

                window.location.href = `/booking.html?${params.toString()}`;
            }

        });

        loadDoctors();
    </script>
</body>

</html>
