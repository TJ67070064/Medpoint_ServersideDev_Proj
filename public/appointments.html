<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ประวัติการนัดหมาย - MedPoint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Prompt', sans-serif; background: #fff; color: #022f56; }
    .status { padding: .36rem .95rem; font-size: .79rem; font-weight: 600; border-radius: 999px; white-space: nowrap; text-align: center; }
    .status-pending { color: #996300; background: #fff3d8; }
    .status-confirmed { color: #237749; background: #e8f6ee; }
    .status-completed { color: #687b8e; background: #edf2f6; }
    .status-cancelled { color: #b94b53; background: #fce9eb; }
    .status-other { color: #165b7b; background: #e2f4fa; }
    .input-control { width: 100%; height: 48px; padding: 0 15px; background: #fff; color: #022f56; border: 1px solid #e4edf4; border-radius: 9px; outline-offset: 2px; }
    .input-control:focus { outline: 2px solid #488db4; }
    .appointment-card { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,.85fr) 175px; gap: 24px; align-items: center; background: #fff; border: 1px solid #e4edf4; border-radius: 15px; padding: 22px; }
    @media (max-width: 900px) { .appointment-card { grid-template-columns: 1fr; gap: 16px; } }
  </style>
</head>
<body class="min-h-screen">
  <!-- Reuse the shared MedPoint navbar instead of copying the Figma header. -->
  <header id="navbar" class="bg-white border-b border-slate-200/80 sticky top-0 z-40"></header>

  <main class="max-w-[1250px] mx-auto px-4 sm:px-6 py-12 md:py-16">
    <h1 class="text-[32px] md:text-[48px] leading-tight font-bold text-[#022f56] mb-8 md:mb-11">ประวัติการนัดหมาย</h1>

    <section class="bg-[#f5f9fc] p-4 md:p-[22px] rounded-xl mb-7" aria-label="ค้นหาและกรองรายการนัดหมาย">
      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-[minmax(0,2fr)_minmax(0,1fr)_minmax(0,1fr)_minmax(0,1.2fr)] gap-3.5">
        <label class="sr-only" for="search">ค้นหาชื่อแพทย์หรือรหัสนัดหมาย</label>
        <input id="search" type="search" class="input-control" placeholder="⌕  ค้นหาชื่อแพทย์หรือรหัสนัดหมาย" autocomplete="off" />

        <label class="sr-only" for="status-filter">กรองตามสถานะ</label>
        <select id="status-filter" class="input-control">
          <option value="all">สถานะ: ทั้งหมด</option>
          <option value="pending">รอยืนยัน</option>
          <option value="confirmed">ยืนยันแล้ว</option>
          <option value="completed">เสร็จสิ้น</option>
          <option value="cancelled">ยกเลิก</option>
        </select>

        <label class="sr-only" for="date-filter">กรองตามวันนัดหมาย</label>
        <select id="date-filter" class="input-control">
          <option value="all">วันที่: ทุกช่วงเวลา</option>
          <option value="upcoming">นัดหมายที่ยังมาไม่ถึง</option>
          <option value="past">นัดหมายที่ผ่านมา</option>
        </select>

        <label class="sr-only" for="sort-filter">เรียงรายการนัดหมาย</label>
        <select id="sort-filter" class="input-control">
          <option value="priority">เรียง: ต้องดำเนินการก่อน</option>
          <option value="newest">วันนัดล่าสุดก่อน</option>
          <option value="oldest">วันนัดเก่าสุดก่อน</option>
        </select>
      </div>
    </section>

    <section aria-labelledby="list-heading">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-5">
        <h2 id="list-heading" class="text-[22px] font-semibold">รายการนัดหมายทั้งหมด</h2>
        <span id="result-count" class="text-sm text-[#718497]" aria-live="polite">กำลังโหลด…</span>
      </div>
      <div id="message" role="status" aria-live="polite" class="hidden rounded-2xl border border-[#e4edf4] bg-[#f5f9fc] px-6 py-12 text-center"></div>
      <div id="appointments-list" class="space-y-3"></div>
    </section>
  </main>

  <div id="detail-overlay" class="hidden fixed inset-0 z-[60] bg-slate-900/40 p-4 flex items-center justify-center" role="presentation">
    <section id="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title" class="w-full max-w-xl max-h-[90vh] overflow-auto rounded-2xl bg-white p-6 shadow-xl" tabindex="-1">
      <div class="flex items-start justify-between gap-4 mb-4">
        <h2 id="detail-title" class="text-xl font-bold text-[#022f56]">รายละเอียดการนัดหมาย</h2>
        <button id="detail-close" type="button" class="p-2 rounded-xl hover:bg-slate-100" aria-label="ปิดรายละเอียด"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="detail-content" class="space-y-4 text-sm"></div>
    </section>
  </div>

  <!-- หน้าต่างยืนยันการยกเลิกนัดหมาย (ไม่ใช้ window.confirm เพื่อคงสไตล์ MEDPOINT) -->
  <div id="cancel-overlay" class="hidden fixed inset-0 z-[70] bg-slate-900/50 p-4 flex items-center justify-center" role="presentation">
    <section id="cancel-dialog" role="dialog" aria-modal="true" aria-labelledby="cancel-title" aria-describedby="cancel-description"
      class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 sm:p-7" tabindex="-1">
      <div class="flex items-start gap-3 mb-4">
        <div class="w-11 h-11 rounded-full bg-[#fce9eb] text-[#b94b53] flex items-center justify-center shrink-0" aria-hidden="true">
          <i data-lucide="calendar-x-2" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0">
          <h2 id="cancel-title" class="font-bold text-xl text-[#022f56]">ยืนยันการยกเลิกนัดหมาย</h2>
          <p id="cancel-description" class="text-sm text-[#718497] mt-1">รายการนี้จะถูกเปลี่ยนสถานะเป็น “ยกเลิก” และยังคงอยู่ในประวัติของคุณ</p>
        </div>
      </div>
      <div id="cancel-summary" class="bg-[#f5f9fc] rounded-xl p-4 text-sm space-y-1 text-[#022f56] break-words"></div>
      <p class="text-sm text-[#718497] mt-4">หลังยกเลิก ช่วงเวลานี้อาจเปิดให้ผู้ป่วยอื่นจองได้อีก หากตารางออกตรวจยังเปิดอยู่</p>
      <p id="cancel-error" class="hidden text-sm text-[#b94b53] mt-3" role="alert"></p>
      <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 mt-6">
        <button id="cancel-back" type="button" class="rounded-[9px] border border-[#bfd5e3] px-5 py-2.5 font-semibold text-[#165b7b] hover:bg-[#f5f9fc]">กลับไปก่อน</button>
        <button id="cancel-confirm" type="button" class="rounded-[9px] bg-[#b94b53] text-white px-5 py-2.5 font-semibold hover:bg-[#a13842] disabled:opacity-50 disabled:cursor-not-allowed">ยืนยันการยกเลิก</button>
      </div>
    </section>
  </div>

  <script src="/js/app.js"></script>
  <script>
    renderNavbar('appointments');

    const { token, user } = getAuth();
    const listEl = document.getElementById('appointments-list');
    const countEl = document.getElementById('result-count');
    const messageEl = document.getElementById('message');
    const overlayEl = document.getElementById('detail-overlay');
    const dialogEl = document.getElementById('detail-dialog');
    let allAppointments = [];
    let lastFocusedButton = null;
    let pendingCancellation = null;
    let cancelOriginButton = null;
    let cancellationInProgress = false;

    const escapeHtml = (text) => String(text ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));

    const statusMeta = {
      pending: { text: 'รอยืนยัน', css: 'status-pending' },
      confirmed: { text: 'ยืนยันแล้ว', css: 'status-confirmed' },
      approved: { text: 'ยืนยันแล้ว', css: 'status-confirmed' },
      waiting: { text: 'รอตรวจ', css: 'status-pending' },
      in_progress: { text: 'กำลังตรวจ', css: 'status-other' },
      completed: { text: 'เสร็จสิ้น', css: 'status-completed' },
      done: { text: 'เสร็จสิ้น', css: 'status-completed' },
      cancelled: { text: 'ยกเลิก', css: 'status-cancelled' },
      canceled: { text: 'ยกเลิก', css: 'status-cancelled' },
    };
    const getStatus = (value) => statusMeta[String(value || '').toLowerCase()] || { text: String(value || 'ไม่ระบุ'), css: 'status-other' };
    const thaiDate = (value) => {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 'ไม่ระบุวันที่' : new Intl.DateTimeFormat('th-TH-u-ca-buddhist', {
        day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Bangkok'
      }).format(date);
    };
    const thaiTime = (value) => {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 'ไม่ระบุเวลา' : new Intl.DateTimeFormat('th-TH', {
        hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Bangkok'
      }).format(date) + ' น.';
    };
    const appointmentTime = (a) => new Date(a.appointmentDate).getTime();
    const isFinished = (a) => ['completed','done','cancelled','canceled'].includes(String(a.status || '').toLowerCase());
    const canCancel = (a) => ['pending', 'confirmed', 'approved'].includes(String(a.status || '').toLowerCase()) && appointmentTime(a) > Date.now();

    function showMessage(html) {
      messageEl.innerHTML = html;
      messageEl.classList.remove('hidden');
      listEl.innerHTML = '';
      refreshIcons();
    }
    function hideMessage() { messageEl.classList.add('hidden'); messageEl.innerHTML = ''; }

    function filteredAppointments() {
      const keyword = document.getElementById('search').value.trim().toLocaleLowerCase('th');
      const status = document.getElementById('status-filter').value;
      const dateFilter = document.getElementById('date-filter').value;
      const sort = document.getElementById('sort-filter').value;
      const now = Date.now();
      const matching = allAppointments.filter((a) => {
        const doctor = a.doctor || {};
        const searchText = [a.id, doctor.docName, doctor.department, doctor.specialization, a.service?.serviceName]
          .filter(Boolean).join(' ').toLocaleLowerCase('th');
        const rawStatus = String(a.status || '').toLowerCase();
        const canonicalStatus = ['approved'].includes(rawStatus) ? 'confirmed' :
          rawStatus === 'canceled' ? 'cancelled' : rawStatus === 'done' ? 'completed' : rawStatus;
        if (keyword && !searchText.includes(keyword)) return false;
        if (status !== 'all' && canonicalStatus !== status) return false;
        const time = appointmentTime(a);
        if (dateFilter === 'upcoming' && time < now) return false;
        if (dateFilter === 'past' && time >= now) return false;
        return true;
      });
      if (sort === 'newest') matching.sort((a, b) => appointmentTime(b) - appointmentTime(a));
      else if (sort === 'oldest') matching.sort((a, b) => appointmentTime(a) - appointmentTime(b));
      else matching.sort((a, b) => {
        const priority = (item) => !isFinished(item) && appointmentTime(item) >= now;
        const ap = priority(a), bp = priority(b);
        if (ap !== bp) return ap ? -1 : 1;
        return ap ? appointmentTime(a) - appointmentTime(b) : appointmentTime(b) - appointmentTime(a);
      });
      return matching;
    }

    function renderCard(a) {
      const status = getStatus(a.status);
      const doctor = a.doctor || {};
      const summary = doctor.specialization || doctor.department || 'ไม่ระบุสาขา';
      const shortId = String(a.id || '').slice(0, 8).toUpperCase();
      return `
        <article class="appointment-card">
          <div class="min-w-0 flex items-center gap-4">
            <div class="h-[76px] w-[76px] rounded-full bg-[#eaf6fc] text-[#488db4] shrink-0 flex items-center justify-center" aria-hidden="true">
              <i data-lucide="user-round" class="w-11 h-11 stroke-[1.6]"></i>
            </div>
            <div class="min-w-0">
              <h3 class="text-lg md:text-xl font-semibold text-[#022f56] break-words">${escapeHtml(doctor.docName || 'ไม่พบข้อมูลแพทย์')}</h3>
              <p class="text-[#718497] text-sm mt-1">${escapeHtml(summary)}</p>
              <p class="text-[#718497] text-xs mt-2">รหัสอ้างอิงย่อ: ${escapeHtml(shortId)}…</p>
            </div>
          </div>
          <div class="min-w-0">
            <p class="text-[#022f56] text-base font-semibold flex items-center gap-2"><i data-lucide="clock-3" class="w-4 h-4 shrink-0"></i>${escapeHtml(thaiDate(a.appointmentDate))} • ${escapeHtml(thaiTime(a.appointmentDate))}</p>
            <p class="text-[#718497] text-sm mt-2">${escapeHtml(a.service?.serviceName || 'ไม่ได้ระบุประเภทบริการ')}</p>
            ${!isFinished(a) && appointmentTime(a) >= Date.now() ? '<p class="text-[#165b7b] text-xs mt-2">แนะนำให้มาถึงก่อนเวลานัด 15 นาที</p>' : ''}
          </div>
          <div class="flex flex-col gap-3 items-stretch sm:items-start md:items-stretch">
            <span class="status ${status.css}">${escapeHtml(status.text)}</span>
            <button type="button" data-details="${escapeHtml(a.id)}" class="rounded-[9px] border border-[#bfd5e3] bg-white hover:bg-[#f5f9fc] px-4 py-2.5 text-[#165b7b] font-semibold text-sm">ดูรายละเอียด</button>
            ${canCancel(a) ? `<button type="button" data-cancel="${escapeHtml(a.id)}" class="rounded-[9px] border border-[#efcbd1] bg-white hover:bg-[#fff5f5] px-4 py-2.5 text-[#b94b53] font-semibold text-sm">ยกเลิกนัดหมาย</button>` : ''}
          </div>
        </article>`;
    }

    function render() {
      const matching = filteredAppointments();
      countEl.textContent = `${matching.length} รายการ`;
      if (!matching.length) {
        showMessage(`<div class="flex justify-center mb-3 text-[#488db4]"><i data-lucide="calendar-x-2" class="w-9 h-9"></i></div><p class="font-semibold text-[#022f56]">ไม่พบรายการนัดหมายตามเงื่อนไข</p><p class="text-sm text-[#718497] mt-2">ลองปรับตัวกรอง หรือค้นหาด้วยชื่อแพทย์อีกครั้ง</p>`);
        return;
      }
      hideMessage();
      listEl.innerHTML = matching.map(renderCard).join('');
      refreshIcons();
    }

    function detailRow(label, value) {
      return `<div class="flex flex-col sm:flex-row sm:gap-6 border-b border-[#e4edf4] pb-3"><span class="sm:w-36 shrink-0 text-[#718497]">${escapeHtml(label)}</span><span class="font-medium text-[#022f56] break-all">${escapeHtml(value)}</span></div>`;
    }

    function openDetails(a, button) {
      const status = getStatus(a.status);
      const doctor = a.doctor || {};
      const service = a.service || {};
      lastFocusedButton = button;
      const amount = service.price == null ? 'ไม่ระบุ' : `${Number(service.price).toLocaleString('th-TH', {minimumFractionDigits:2, maximumFractionDigits:2})} บาท`;
      document.getElementById('detail-content').innerHTML = `
        <div class="mb-5"><span class="status ${status.css}">${escapeHtml(status.text)}</span></div>
        ${detailRow('แพทย์', doctor.docName || 'ไม่ระบุ')}
        ${detailRow('แผนก / สาขา', doctor.specialization || doctor.department || 'ไม่ระบุ')}
        ${detailRow('วันนัดหมาย', thaiDate(a.appointmentDate))}
        ${detailRow('เวลานัดหมาย', thaiTime(a.appointmentDate))}
        ${detailRow('ประเภทบริการ', service.serviceName || 'ไม่ได้ระบุ')}
        ${detailRow('ค่าบริการ', amount)}
        ${detailRow('รหัสนัดหมาย (UUID)', a.id)}
        <p class="text-xs text-[#718497]">หมายเหตุ: ข้อมูลห้องตรวจและเลขคิวไม่ได้ถูกบันทึกใน Appointment schema ปัจจุบัน จึงยังไม่แสดงข้อมูลสองส่วนนี้</p>`;
      overlayEl.classList.remove('hidden');
      dialogEl.focus();
      refreshIcons();
    }
    function closeDetails() {
      overlayEl.classList.add('hidden');
      if (lastFocusedButton) lastFocusedButton.focus();
    }

    const cancelOverlay = document.getElementById('cancel-overlay');
    const cancelDialog = document.getElementById('cancel-dialog');
    const cancelConfirmButton = document.getElementById('cancel-confirm');
    const cancelBackButton = document.getElementById('cancel-back');
    const cancelError = document.getElementById('cancel-error');

    function openCancelDialog(item, button) {
      if (!canCancel(item)) return;
      pendingCancellation = item;
      cancelOriginButton = button;
      cancelError.textContent = '';
      cancelError.classList.add('hidden');
      cancelConfirmButton.disabled = false;
      cancelBackButton.disabled = false;
      cancelConfirmButton.textContent = 'ยืนยันการยกเลิก';
      document.getElementById('cancel-summary').innerHTML = `
        <p class="font-semibold">${escapeHtml(item.doctor?.docName || 'ไม่พบข้อมูลแพทย์')}</p>
        <p>${escapeHtml(thaiDate(item.appointmentDate))} • ${escapeHtml(thaiTime(item.appointmentDate))}</p>
        <p class="text-[#718497] text-xs">รหัสนัดหมาย: ${escapeHtml(item.id)}</p>`;
      cancelOverlay.classList.remove('hidden');
      cancelBackButton.focus();
      refreshIcons();
    }
    function closeCancelDialog() {
      if (cancellationInProgress) return;
      cancelOverlay.classList.add('hidden');
      pendingCancellation = null;
      if (cancelOriginButton?.isConnected) cancelOriginButton.focus();
      else document.querySelector('[data-details]')?.focus();
    }
    async function confirmCancellation() {
      if (!pendingCancellation || cancellationInProgress) return;
      cancellationInProgress = true;
      cancelConfirmButton.disabled = true;
      cancelBackButton.disabled = true;
      cancelConfirmButton.textContent = 'กำลังยกเลิก…';
      cancelError.classList.add('hidden');
      try {
        const response = await fetch(`${API_URL}/appointments/${encodeURIComponent(pendingCancellation.id)}/cancel`, {
          method: 'PATCH',
          headers: { Authorization: `Bearer ${token}` },
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.message || 'ไม่สามารถยกเลิกนัดหมายได้');
        const cancelledId = pendingCancellation.id;
        const index = allAppointments.findIndex((a) => a.id === cancelledId);
        if (index >= 0) allAppointments[index] = { ...allAppointments[index], status: 'cancelled' };
        cancelOverlay.classList.add('hidden');
        pendingCancellation = null;
        render();
        document.querySelector(`[data-details="${cancelledId}"]`)?.focus();
      } catch (error) {
        cancelError.textContent = error.message;
        cancelError.classList.remove('hidden');
      } finally {
        cancellationInProgress = false;
        cancelConfirmButton.disabled = false;
        cancelBackButton.disabled = false;
        cancelConfirmButton.textContent = 'ยืนยันการยกเลิก';
      }
    }

    listEl.addEventListener('click', (event) => {
      const detailButton = event.target.closest('[data-details]');
      if (detailButton) {
        const item = allAppointments.find((a) => a.id === detailButton.dataset.details);
        if (item) openDetails(item, detailButton);
        return;
      }
      const cancelButton = event.target.closest('[data-cancel]');
      if (cancelButton) {
        const item = allAppointments.find((a) => a.id === cancelButton.dataset.cancel);
        if (item) openCancelDialog(item, cancelButton);
      }
    });
    cancelBackButton.addEventListener('click', closeCancelDialog);
    cancelConfirmButton.addEventListener('click', confirmCancellation);
    cancelOverlay.addEventListener('click', (event) => { if (event.target === cancelOverlay) closeCancelDialog(); });
    cancelDialog.addEventListener('keydown', (event) => {
      if (event.key !== 'Tab') return;
      const focusable = [cancelBackButton, cancelConfirmButton].filter((el) => !el.disabled);
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (!first) { event.preventDefault(); cancelDialog.focus(); return; }
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    });
    document.getElementById('detail-close').addEventListener('click', closeDetails);
    overlayEl.addEventListener('click', (event) => { if (event.target === overlayEl) closeDetails(); });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape') return;
      if (!cancelOverlay.classList.contains('hidden')) closeCancelDialog();
      else if (!overlayEl.classList.contains('hidden')) closeDetails();
    });
    ['search', 'status-filter', 'date-filter', 'sort-filter'].forEach((id) => {
      document.getElementById(id).addEventListener(id === 'search' ? 'input' : 'change', render);
    });

    async function loadAppointments() {
      if (!token) {
        countEl.textContent = '0 รายการ';
        showMessage('<p class="text-[#022f56] font-semibold">กรุณาเข้าสู่ระบบก่อนดูประวัติการนัดหมาย</p><a class="inline-block mt-4 px-5 py-2.5 bg-[#165b7b] text-white rounded-lg" href="/auth.html">ไปหน้าเข้าสู่ระบบ</a>');
        return;
      }
      if (user?.role !== 'PATIENT') {
        countEl.textContent = '0 รายการ';
        showMessage('<p class="font-semibold">หน้านี้สำหรับบัญชีผู้ป่วย (PATIENT) เท่านั้น</p>');
        return;
      }
      try {
        const response = await fetch(`${API_URL}/appointments/my`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!response.ok) throw new Error(response.status === 401 || response.status === 403 ? 'กรุณาเข้าสู่ระบบใหม่' : 'ไม่สามารถโหลดประวัติการนัดหมายได้');
        const data = await response.json();
        if (!Array.isArray(data)) throw new Error('รูปแบบข้อมูลจาก API ไม่ถูกต้อง');
        allAppointments = data;
        if (!data.length) {
          countEl.textContent = '0 รายการ';
          showMessage('<div class="flex justify-center mb-3 text-[#488db4]"><i data-lucide="calendar-days" class="w-9 h-9"></i></div><p class="font-semibold text-[#022f56]">ยังไม่มีประวัติการนัดหมาย</p><p class="text-sm text-[#718497] mt-2">เมื่อจองคิวสำเร็จ รายการนัดหมายจะมาแสดงที่นี่</p><a class="inline-block mt-4 px-5 py-2.5 bg-[#165b7b] text-white rounded-lg" href="/doctors.html">ค้นหาแพทย์</a>');
          return;
        }
        render();
      } catch (error) {
        countEl.textContent = 'ไม่สามารถโหลดข้อมูลได้';
        showMessage(`<p class="font-semibold text-red-700">${escapeHtml(error.message)}</p><p class="text-sm text-[#718497] mt-2">ตรวจสอบว่าเพิ่ม Route /api/v1/appointments/my แล้ว และ Server กำลังทำงานอยู่</p>`);
      }
    }
    loadAppointments();
  </script>
</body>
</html>
