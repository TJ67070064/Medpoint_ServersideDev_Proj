<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>สถานะคิวของฉัน | MedPoint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Prompt', Arial, sans-serif; font-size: 16px; }
    [hidden] { display: none !important; }
    :is(button, a):focus-visible { outline: 3px solid #53a8cd; outline-offset: 3px; }
    button { min-height: 44px; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    #own-tabs button[aria-pressed="true"] { background: #134e6f; color: white; border-color: #134e6f; }
    .queue-number { font-size: clamp(56px, 12vw, 80px); line-height: 1.15; letter-spacing: -.04em; }
    .badge { display: inline-flex; padding: 8px 16px; border-radius: 999px; font-size: 16px; font-weight: 500; }
    .badge-waiting { background: #fff4d9; color: #855a00; }
    .badge-in_progress { background: #dbf1f8; color: #14657c; }
    .badge-completed { background: #e6f5eb; color: #267344; }
    .badge-pending, .badge-unknown { background: #edf1f5; color: #526578; }
    .badge-cancelled { background: #fdebef; color: #ad3854; }
  </style>
</head>
<body class="min-h-screen bg-[#f7fafc] text-[#0f354a] antialiased">
  <header id="navbar" class="sticky top-0 z-40 border-b border-slate-200/80 bg-white"></header>
  <main class="mx-auto max-w-3xl px-4 py-8 sm:px-6 sm:py-12">
    <p class="text-sm font-medium tracking-wider text-[#5786a1]">MEDPOINT / PATIENT</p>
    <h1 class="mt-2 text-3xl font-semibold sm:text-4xl">สถานะคิวของฉัน</h1>
    <p class="mt-3 leading-relaxed text-[#688498]">ตรวจสอบเลขคิวและสถานะนัดหมายของคุณได้ที่นี่</p>
    <noscript><p class="mt-5 rounded-xl bg-amber-50 p-5">กรุณาเปิด JavaScript เพื่อดูสถานะคิว</p></noscript>
    <section id="access-message" class="mt-6 rounded-2xl border bg-white p-6 leading-loose" hidden></section>
    <p id="queue-error" role="alert" class="mt-5 rounded-xl border border-amber-200 bg-amber-50 p-4 leading-relaxed text-amber-900" hidden></p>
    <div id="queue-workspace" hidden>
      <div class="my-6 flex flex-wrap items-center justify-between gap-4">
        <div id="own-tabs" class="flex flex-wrap gap-2" role="group" aria-label="เลือกนัดหมายของฉัน">
          <button type="button" data-scope="active" aria-pressed="true" class="rounded-xl border border-[#cfdfeb] px-4 py-2 text-sm">วันนี้และนัดถัดไป</button>
          <button type="button" data-scope="all" aria-pressed="false" class="rounded-xl border border-[#cfdfeb] px-4 py-2 text-sm">ทั้งหมดของฉัน</button>
        </div>
        <button id="refresh-queue" type="button" class="rounded-xl border border-[#cfdfeb] bg-white px-4 py-2 text-sm font-medium text-[#134e6f]">รีเฟรช</button>
      </div>
      <p id="sync-status" class="mb-4 text-sm text-[#688498]" role="status">กำลังโหลดสถานะคิว…</p>
      <section id="my-queues" class="space-y-5" aria-label="นัดหมายของฉัน" aria-busy="true"></section>
      <div id="pagination" class="mt-5 flex flex-wrap items-center justify-between gap-3 text-sm" hidden>
        <p id="queue-page-summary"></p>
        <div class="flex items-center gap-3">
          <button id="queue-previous" type="button" class="rounded-xl border px-4 py-2">ก่อนหน้า</button>
          <span id="queue-page-number"></span>
          <button id="queue-next" type="button" class="rounded-xl border px-4 py-2">ถัดไป</button>
        </div>
      </div>
      <p class="mt-6 text-sm leading-relaxed text-[#688498]">อัปเดตอัตโนมัติทุก 5 วินาทีขณะเปิดหน้านี้อยู่</p>
      <a href="/appointments.html" class="mt-3 inline-block py-2 font-medium text-[#134e6f] underline underline-offset-4">ดูประวัตินัดหมาย / จองนัด</a>
    </div>
  </main>
  <div id="queue-announcement" role="status" aria-live="polite" class="fixed bottom-5 left-4 right-4 z-50 mx-auto max-w-xl rounded-2xl bg-[#134e6f] p-5 text-white shadow-lg" hidden></div>
  <script src="/js/app.js"></script>
  <script src="/js/patient-queue.js"></script>
</body>
</html>
